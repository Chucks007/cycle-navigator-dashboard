services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: cycle-navigator-postgres
    environment:
      - POSTGRES_DB=cycle_navigator
      - POSTGRES_USER=cycle_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cycle_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cycle_user -d cycle_navigator"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: cycle-navigator-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: cycle-navigator-backend
    ports:
      - "8000:8000"
    environment:
      - FRED_API_KEY=${FRED_API_KEY:-}
      - DATABASE_URL=postgresql://cycle_user:${POSTGRES_PASSWORD:-cycle_password}@postgres:5432/cycle_navigator
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  celery-worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: cycle-navigator-celery-worker
    command: celery -A backend.celery_app worker --loglevel=info --concurrency=2
    environment:
      - FRED_API_KEY=${FRED_API_KEY:-}
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
      - DATABASE_URL=postgresql://cycle_user:${POSTGRES_PASSWORD:-cycle_password}@postgres:5432/cycle_navigator
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.celery_app inspect ping -d celery@$$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  celery-beat:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: cycle-navigator-celery-beat
    command: celery -A backend.celery_app beat --loglevel=info
    environment:
      - FRED_API_KEY=${FRED_API_KEY:-}
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
      - DATABASE_URL=postgresql://cycle_user:${POSTGRES_PASSWORD:-cycle_password}@postgres:5432/cycle_navigator
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Empty NEXT_PUBLIC_API_URL means client-side uses relative paths (proxied by Next.js)
        NEXT_PUBLIC_API_URL: ""
        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    container_name: cycle-navigator-web
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
      - NEXT_PUBLIC_API_URL=
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres_data:
