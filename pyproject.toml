[project]
name = "cycle-navigator-dashboard"
version = "0.1.0"
description = "Cycle Navigator Dashboard - Market cycle analysis and visualization"
requires-python = ">=3.11"

[tool.ruff]
# Target Python 3.11
target-version = "py311"

# Include paths for linting
include = ["backend/**/*.py", "scripts/**/*.py", "stock_dashboard.py"]

# Exclude generated and build artifacts
exclude = [
    "__pycache__",
    "artifacts",
    "venv",
    ".venv",
    ".git",
    ".github",
    "*.pyc",
    ".pytest_cache",
    ".ruff_cache",
]

# Line length
line-length = 100

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Ignore specific rules if needed
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B904",  # Exception chaining (raise ... from err) - can add later
]

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py files
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "-ra",
]
filterwarnings = [
    # Only ignore specific known third-party deprecations
    # Fail on any deprecations from our own code
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    # Allow specific third-party library warnings that we can't control
    "ignore::DeprecationWarning:urllib3",
    "ignore::DeprecationWarning:pkg_resources",
]
