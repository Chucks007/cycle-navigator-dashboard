name: E2E Tests (Playwright)

on:
  workflow_dispatch:
  schedule:
    # Run nightly at 2 AM UTC (optional)
    - cron: '0 2 * * *'

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Build container image
        run: |
          docker build -f Containerfile -t cycle-navigator-dashboard:e2e .

      - name: Start application container
        run: |
          docker run -d \
            --name cycle-navigator-app \
            -p 8000:8000 \
            -p 8501:8501 \
            -e FRED_API_KEY=${{ secrets.FRED_API_KEY }} \
            cycle-navigator-dashboard:e2e

      - name: Wait for application to be ready
        run: |
          echo "Waiting for backend at http://localhost:8000..."
          for i in {1..30}; do
            if curl -f http://localhost:8000/health 2>/dev/null; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i: Backend not ready yet, waiting..."
            sleep 2
          done
          
          echo "Waiting for Streamlit at http://localhost:8501..."
          for i in {1..30}; do
            if curl -f http://localhost:8501 2>/dev/null; then
              echo "Streamlit is ready!"
              break
            fi
            echo "Attempt $i: Streamlit not ready yet, waiting..."
            sleep 2
          done

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_HEADLESS: true
        run: |
          python scripts/playwright/test_dashboard.py

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            screenshots/
            traces/
          retention-days: 7

      - name: Stop and remove container
        if: always()
        run: |
          docker stop cycle-navigator-app || true
          docker rm cycle-navigator-app || true

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs cycle-navigator-app || echo "Container logs not available"
