name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run unit tests with pytest
        run: |
          pytest -q

      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          tags: cycle-navigator-dashboard:${{ github.sha }}

      - name: Verify container dependencies
        run: |
          echo "Verifying container image was built successfully..."
          docker images cycle-navigator-dashboard:${{ github.sha }}
          echo "Checking installed Python packages in container..."
          docker run --rm cycle-navigator-dashboard:${{ github.sha }} pip list
          echo "Verifying key dependencies are installed..."
          docker run --rm cycle-navigator-dashboard:${{ github.sha }} python -c "import fastapi; import streamlit; import yfinance; import pandas; print('All core dependencies verified!')"
