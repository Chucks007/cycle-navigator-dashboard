name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Permissions required for GHCR push
permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run unit tests with pytest
        run: |
          pytest -q

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/develop' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify container dependencies
        run: |
          echo "Verifying container image was built successfully..."
          # Use the SHA tag for verification (always available)
          docker images ghcr.io/${{ github.repository }}:${{ github.sha }} || docker images cycle-navigator-dashboard
          echo "Checking installed Python packages in container..."
          docker run --rm ghcr.io/${{ github.repository }}:${{ github.sha }} pip list 2>/dev/null || docker run --rm $(docker images -q | head -1) pip list
          echo "Verifying key dependencies are installed..."
          docker run --rm ghcr.io/${{ github.repository }}:${{ github.sha }} python -c "import fastapi; import streamlit; import yfinance; import pandas; print('All core dependencies verified!')" 2>/dev/null || docker run --rm $(docker images -q | head -1) python -c "import fastapi; import streamlit; import yfinance; import pandas; print('All core dependencies verified!')"
